# Render Blueprint Specification for NoteTube
# https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. NoteTube FastAPI Backend Service
  # -------------------------------------------------------------
  - type: web
    name: notetube-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: gemini
      - key: FRONTEND_URL
        value: https://notetube-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. NoteTube React / Vite Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: notetube-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Rewrite all routes to /index.html for React Router SPA (/, /video, /results/:jobId)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Points to the public URL of the backend web service with /api suffix
      - key: VITE_API_URL
        value: https://notetube-backend.onrender.com/api
